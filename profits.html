<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="config.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            min-height: 100vh;
        }

        .dashboard-header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .dashboard-header h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 32px;
        }

        .kpi-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .kpi-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
            transition: transform 0.3s;
        }

        .kpi-card:hover {
            transform: translateY(-5px);
        }

        .kpi-card.secondary {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .kpi-card.tertiary {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }

        .kpi-card.quaternary {
            background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
        }

        .kpi-label {
            font-size: 12px;
            opacity: 0.9;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .kpi-value {
            font-size: 28px;
            font-weight: bold;
        }

        .dashboard-container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(600px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .chart-card {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .chart-card h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 18px;
            border-bottom: 3px solid #667eea;
            padding-bottom: 10px;
        }

        .chart-controls {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .control-btn {
            padding: 8px 14px;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            font-size: 12px;
        }

        .control-btn:hover {
            background: #f0f0f0;
        }

        .control-btn.active {
            background: #667eea;
            color: white;
        }

        canvas {
            width: 100% !important;
            height: 300px !important;
        }

        .chart-wrapper {
            position: relative;
            min-height: 350px;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #eee;
        }

        .stat-item {
            text-align: center;
        }

        .stat-label {
            font-size: 11px;
            color: #666;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 16px;
            font-weight: bold;
            color: #333;
        }

        .no-data {
            text-align: center;
            color: #999;
            padding: 40px;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .charts-grid {
                grid-template-columns: 1fr;
            }

            .dashboard-header h1 {
                font-size: 24px;
            }

            .kpi-container {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
    <script>
        let chartInstances = {};
        let rawData = null;

        async function fetchData() {
            try {
                let response = await fetch(API_URL, {
                    method: 'POST',
                    body: new URLSearchParams({
                        operations: JSON.stringify([{
                            opCode: "FETCH_ALL",
                            sheetId: "11TA2pPlxqajVwkPEigNMPNfsV-12CExxmySk1OMw_v8",
                            tabName: "cumilativeCalculations",
                            opId: "f6893973-f58c-4c10-a219-d9b281138026-1740944738031"
                        }])
                    })
                });

                rawData = await response.json();
                updateDashboard();

            } catch (error) {
                console.error("Error fetching data:", error);
            }
        }

        function updateDashboard() {
            updateKPIs();
            updateProfitChart('month');
            updateExpensesChart('month');
            updateAmountChart('month');
            updateDueBalanceChart('month');
            updateDeliveryRateChart('month');
            updateKgVsPcChart('month');
        }

        function getMonthName(monthIndex) {
            return ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"][monthIndex];
        }

        function getWeek(date) {
            let firstDay = new Date(date.getFullYear(), 0, 1);
            return Math.ceil((((date - firstDay) / 86400000) + firstDay.getDay() + 1) / 7);
        }

        function formatDate(date, groupBy) {
            switch(groupBy) {
                case 'day':
                    return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
                case 'week':
                    return `${date.getFullYear()} W${getWeek(date)}`;
                case 'month':
                    return `${getMonthName(date.getMonth())} ${date.getFullYear()}`;
                case 'year':
                    return `${date.getFullYear()}`;
                default:
                    return '';
            }
        }

        function updateKPIs() {
            if (!rawData) return;

            let totalProfit = 0;
            let totalKg = 0;
            let totalPc = 0;
            let totalDeliveredKg = 0;
            let totalSoldAmount = 0;
            let totalExpenses = 0;
            let totalTransportIncome = 0;
            let latestDueBalance = 0;

            rawData[0].content.forEach(entry => {
                if (entry.profit && entry.profit !== "#N/A") totalProfit += parseFloat(entry.profit) || 0;
                if (entry.kg && entry.kg !== "#N/A") totalKg += parseFloat(entry.kg) || 0;
                if (entry.pc && entry.pc !== "#N/A") totalPc += parseFloat(entry.pc) || 0;
                if (entry.deliveredKg && entry.deliveredKg !== "#N/A") totalDeliveredKg += parseFloat(entry.deliveredKg) || 0;
                if (entry.sold_amount && entry.sold_amount !== "#N/A") totalSoldAmount += parseFloat(entry.sold_amount) || 0;
                if (entry.total_expenses && entry.total_expenses !== "#N/A") totalExpenses += parseFloat(entry.total_expenses) || 0;
                if (entry.transport_income && entry.transport_income !== "#N/A") totalTransportIncome += parseFloat(entry.transport_income) || 0;
                if (entry.new_due_balance && entry.new_due_balance !== "#N/A") latestDueBalance = parseFloat(entry.new_due_balance) || 0;
            });

            document.getElementById('totalProfit').textContent = `₹${totalProfit.toLocaleString('en-IN', {maximumFractionDigits: 0})}`;
            document.getElementById('totalKg').textContent = `${totalKg.toLocaleString('en-IN', {maximumFractionDigits: 1})} KG`;
            document.getElementById('totalDelivered').textContent = `${totalDeliveredKg.toLocaleString('en-IN', {maximumFractionDigits: 1})} KG`;
            document.getElementById('totalAmount').textContent = `₹${totalSoldAmount.toLocaleString('en-IN', {maximumFractionDigits: 0})}`;
            document.getElementById('costPerKg').textContent = `₹${(totalExpenses / totalKg).toLocaleString('en-IN', {maximumFractionDigits: 0})}/KG`;
            document.getElementById('dueBalance').textContent = `₹${latestDueBalance.toLocaleString('en-IN', {maximumFractionDigits: 0})}`;
        }

        function groupDataByPeriod(groupBy, field) {
            let grouped = {};
            let dateMap = {};

            rawData[0].content.forEach(entry => {
                if (!entry.date) return;

                let date = new Date(entry.date);
                if (isNaN(date.getTime())) return;

                let key = formatDate(date, groupBy);
                if (!grouped[key]) {
                    grouped[key] = 0;
                    dateMap[key] = date;
                }

                let value = parseFloat(entry[field]) || 0;
                if (entry[field] !== "#N/A") {
                    grouped[key] += value;
                }
            });

            let labels = Object.keys(grouped).sort((a, b) => dateMap[a] - dateMap[b]);
            let values = labels.map(label => grouped[label]);

            return { labels, values };
        }

        function destroyChart(chartId) {
            if (chartInstances[chartId]) {
                chartInstances[chartId].destroy();
            }
        }

        function updateProfitChart(groupBy) {
            if (!rawData) return;

            let { labels, values } = groupDataByPeriod(groupBy, 'profit');

            let ctx = document.getElementById('profitChart');
            if (!ctx) return;

            destroyChart('profitChart');

            chartInstances['profitChart'] = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Profit',
                        data: values,
                        backgroundColor: 'rgba(102, 126, 234, 0.7)',
                        borderColor: 'rgba(102, 126, 234, 1)',
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: { beginAtZero: true }
                    }
                }
            });
        }

        function updateExpensesChart(groupBy) {
            if (!rawData) return;

            let groupedCar = {};
            let groupedLabour = {};
            let groupedExtra = {};
            let dateMap = {};

            rawData[0].content.forEach(entry => {
                if (!entry.date) return;
                let date = new Date(entry.date);
                if (isNaN(date.getTime())) return;

                let key = formatDate(date, groupBy);
                if (!groupedCar[key]) {
                    groupedCar[key] = 0;
                    groupedLabour[key] = 0;
                    groupedExtra[key] = 0;
                    dateMap[key] = date;
                }

                groupedCar[key] += parseFloat(entry.car_expense) || 0;
                groupedLabour[key] += parseFloat(entry.labour_expense) || 0;
                groupedExtra[key] += parseFloat(entry.extra_expenses) || 0;
            });

            let labels = Object.keys(groupedCar).sort((a, b) => dateMap[a] - dateMap[b]);

            let ctx = document.getElementById('expensesChart');
            if (!ctx) return;

            destroyChart('expensesChart');

            chartInstances['expensesChart'] = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: 'Car Expense',
                            data: labels.map(l => groupedCar[l]),
                            backgroundColor: 'rgba(245, 87, 108, 0.7)',
                            borderColor: 'rgba(245, 87, 108, 1)',
                            borderWidth: 1
                        },
                        {
                            label: 'Labour Expense',
                            data: labels.map(l => groupedLabour[l]),
                            backgroundColor: 'rgba(255, 165, 0, 0.7)',
                            borderColor: 'rgba(255, 165, 0, 1)',
                            borderWidth: 1
                        },
                        {
                            label: 'Extra Expense',
                            data: labels.map(l => groupedExtra[l]),
                            backgroundColor: 'rgba(155, 89, 182, 0.7)',
                            borderColor: 'rgba(155, 89, 182, 1)',
                            borderWidth: 1
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: { beginAtZero: true },
                        x: { stacked: false }
                    }
                }
            });
        }

        function updateAmountChart(groupBy) {
            if (!rawData) return;

            let groupedSold = {};
            let groupedPaid = {};
            let dateMap = {};

            rawData[0].content.forEach(entry => {
                if (!entry.date) return;
                let date = new Date(entry.date);
                if (isNaN(date.getTime())) return;

                let key = formatDate(date, groupBy);
                if (!groupedSold[key]) {
                    groupedSold[key] = 0;
                    groupedPaid[key] = 0;
                    dateMap[key] = date;
                }

                groupedSold[key] += parseFloat(entry.sold_amount) || 0;
                groupedPaid[key] += parseFloat(entry.paid_amount) || 0;
            });

            let labels = Object.keys(groupedSold).sort((a, b) => dateMap[a] - dateMap[b]);

            let ctx = document.getElementById('amountChart');
            if (!ctx) return;

            destroyChart('amountChart');

            chartInstances['amountChart'] = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: 'Sold Amount',
                            data: labels.map(l => groupedSold[l]),
                            borderColor: 'rgba(67, 233, 123, 1)',
                            backgroundColor: 'rgba(67, 233, 123, 0.1)',
                            borderWidth: 2,
                            tension: 0.4,
                            fill: true
                        },
                        {
                            label: 'Paid Amount',
                            data: labels.map(l => groupedPaid[l]),
                            borderColor: 'rgba(79, 172, 254, 1)',
                            backgroundColor: 'rgba(79, 172, 254, 0.1)',
                            borderWidth: 2,
                            tension: 0.4,
                            fill: true
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: { y: { beginAtZero: true } }
                }
            });
        }

        function updateDueBalanceChart(groupBy) {
            if (!rawData) return;

            let dueBalances = [];
            let dateMap = {};

            rawData[0].content.forEach(entry => {
                if (!entry.date || !entry.new_due_balance || entry.new_due_balance === "#N/A") return;

                let date = new Date(entry.date);
                if (isNaN(date.getTime())) return;

                dueBalances.push({
                    date: date,
                    balance: parseFloat(entry.new_due_balance) || 0
                });
            });

            dueBalances.sort((a, b) => a.date - b.date);

            let labels = dueBalances.map(d => formatDate(d.date, groupBy));
            let values = dueBalances.map(d => d.balance);

            let ctx = document.getElementById('dueBalanceChart');
            if (!ctx) return;

            destroyChart('dueBalanceChart');

            chartInstances['dueBalanceChart'] = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Due Balance',
                        data: values,
                        borderColor: 'rgba(240, 147, 251, 1)',
                        backgroundColor: 'rgba(240, 147, 251, 0.1)',
                        borderWidth: 2,
                        tension: 0.4,
                        fill: true
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: { y: { beginAtZero: false } }
                }
            });
        }

        function updateDeliveryRateChart(groupBy) {
            if (!rawData) return;

            let groupedDelivered = {};
            let groupedTotal = {};
            let dateMap = {};

            rawData[0].content.forEach(entry => {
                if (!entry.date) return;
                let date = new Date(entry.date);
                if (isNaN(date.getTime())) return;

                let key = formatDate(date, groupBy);
                if (!groupedDelivered[key]) {
                    groupedDelivered[key] = 0;
                    groupedTotal[key] = 0;
                    dateMap[key] = date;
                }

                groupedDelivered[key] += parseFloat(entry.deliveredKg) || 0;
                groupedTotal[key] += parseFloat(entry.kg) || 0;
            });

            let labels = Object.keys(groupedDelivered).sort((a, b) => dateMap[a] - dateMap[b]);
            let rates = labels.map(l => ((groupedDelivered[l] / groupedTotal[l]) * 100).toFixed(1));

            let ctx = document.getElementById('deliveryChart');
            if (!ctx) return;

            destroyChart('deliveryChart');

            chartInstances['deliveryChart'] = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Delivery Rate %',
                        data: rates,
                        borderColor: 'rgba(76, 175, 80, 1)',
                        backgroundColor: 'rgba(76, 175, 80, 0.1)',
                        borderWidth: 2,
                        tension: 0.4,
                        fill: true
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: { y: { beginAtZero: true, max: 105 } }
                }
            });
        }

        function updateKgVsPcChart(groupBy) {
            if (!rawData) return;

            let { labels: kgLabels, values: kgValues } = groupDataByPeriod(groupBy, 'kg');
            let { values: pcValues } = groupDataByPeriod(groupBy, 'pc');

            let ctx = document.getElementById('kgPcChart');
            if (!ctx) return;

            destroyChart('kgPcChart');

            chartInstances['kgPcChart'] = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: kgLabels,
                    datasets: [
                        {
                            label: 'KG',
                            data: kgValues,
                            backgroundColor: 'rgba(102, 126, 234, 0.7)',
                            borderColor: 'rgba(102, 126, 234, 1)',
                            borderWidth: 1,
                            yAxisID: 'y'
                        },
                        {
                            label: 'PC',
                            data: pcValues,
                            backgroundColor: 'rgba(245, 87, 108, 0.7)',
                            borderColor: 'rgba(245, 87, 108, 1)',
                            borderWidth: 1,
                            yAxisID: 'y1'
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: { beginAtZero: true, position: 'left', title: { display: true, text: 'KG' } },
                        y1: { beginAtZero: true, position: 'right', title: { display: true, text: 'PC' } }
                    }
                }
            });
        }

        function setupControls() {
            document.querySelectorAll('.control-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    let chartType = this.dataset.chart;
                    let groupBy = this.dataset.group;

                    document.querySelectorAll(`.control-btn[data-chart="${chartType}"]`).forEach(b => {
                        b.classList.remove('active');
                    });
                    this.classList.add('active');

                    if (chartType === 'profit') updateProfitChart(groupBy);
                    else if (chartType === 'expenses') updateExpensesChart(groupBy);
                    else if (chartType === 'amount') updateAmountChart(groupBy);
                    else if (chartType === 'balance') updateDueBalanceChart(groupBy);
                    else if (chartType === 'delivery') updateDeliveryRateChart(groupBy);
                    else if (chartType === 'kgpc') updateKgVsPcChart(groupBy);
                });
            });
        }

        document.addEventListener("DOMContentLoaded", function() {
            setupControls();
        });
    </script>
</head>
<body onload="fetchData()">
<div class="dashboard-container">
    <!-- Header -->
    <div class="dashboard-header">
        <h1>📊 Business Dashboard</h1>
        <div class="kpi-container">
            <div class="kpi-card">
                <div class="kpi-label">Total Profit</div>
                <div class="kpi-value" id="totalProfit">₹0</div>
            </div>
            <div class="kpi-card secondary">
                <div class="kpi-label">Total KG</div>
                <div class="kpi-value" id="totalKg">0 KG</div>
            </div>
            <div class="kpi-card tertiary">
                <div class="kpi-label">Delivered KG</div>
                <div class="kpi-value" id="totalDelivered">0 KG</div>
            </div>
            <div class="kpi-card quaternary">
                <div class="kpi-label">Sold Amount</div>
                <div class="kpi-value" id="totalAmount">₹0</div>
            </div>
            <div class="kpi-card">
                <div class="kpi-label">Cost/KG</div>
                <div class="kpi-value" id="costPerKg">₹0</div>
            </div>
            <div class="kpi-card secondary">
                <div class="kpi-label">Due Balance</div>
                <div class="kpi-value" id="dueBalance">₹0</div>
            </div>
        </div>
    </div>

    <!-- Charts -->
    <div class="charts-grid">
        <!-- Profit Chart -->
        <div class="chart-card">
            <h3>💰 Profit Trend</h3>
            <div class="chart-controls">
                <button class="control-btn active" data-chart="profit" data-group="day">Day</button>
                <button class="control-btn" data-chart="profit" data-group="week">Week</button>
                <button class="control-btn" data-chart="profit" data-group="month">Month</button>
                <button class="control-btn" data-chart="profit" data-group="year">Year</button>
            </div>
            <div class="chart-wrapper">
                <canvas id="profitChart"></canvas>
            </div>
        </div>

        <!-- Expenses Chart -->
        <div class="chart-card">
            <h3>💸 Expenses Breakdown</h3>
            <div class="chart-controls">
                <button class="control-btn active" data-chart="expenses" data-group="day">Day</button>
                <button class="control-btn" data-chart="expenses" data-group="week">Week</button>
                <button class="control-btn" data-chart="expenses" data-group="month">Month</button>
                <button class="control-btn" data-chart="expenses" data-group="year">Year</button>
            </div>
            <div class="chart-wrapper">
                <canvas id="expensesChart"></canvas>
            </div>
        </div>

        <!-- Amount Chart -->
        <div class="chart-card">
            <h3>💵 Sold vs Paid Amount</h3>
            <div class="chart-controls">
                <button class="control-btn active" data-chart="amount" data-group="day">Day</button>
                <button class="control-btn" data-chart="amount" data-group="week">Week</button>
                <button class="control-btn" data-chart="amount" data-group="month">Month</button>
                <button class="control-btn" data-chart="amount" data-group="year">Year</button>
            </div>
            <div class="chart-wrapper">
                <canvas id="amountChart"></canvas>
            </div>
        </div>

        <!-- Delivery Rate Chart -->
        <div class="chart-card">
            <h3>🚚 Delivery Rate</h3>
            <div class="chart-controls">
                <button class="control-btn active" data-chart="delivery" data-group="day">Day</button>
                <button class="control-btn" data-chart="delivery" data-group="week">Week</button>
                <button class="control-btn" data-chart="delivery" data-group="month">Month</button>
                <button class="control-btn" data-chart="delivery" data-group="year">Year</button>
            </div>
            <div class="chart-wrapper">
                <canvas id="deliveryChart"></canvas>
            </div>
        </div>

        <!-- Due Balance Chart -->
        <div class="chart-card">
            <h3>📈 Due Balance Trend</h3>
            <div class="chart-controls">
                <button class="control-btn active" data-chart="balance" data-group="day">Day</button>
                <button class="control-btn" data-chart="balance" data-group="week">Week</button>
                <button class="control-btn" data-chart="balance" data-group="month">Month</button>
                <button class="control-btn" data-chart="balance" data-group="year">Year</button>
            </div>
            <div class="chart-wrapper">
                <canvas id="dueBalanceChart"></canvas>
            </div>
        </div>

        <!-- KG vs PC Chart -->
        <div class="chart-card">
            <h3>📦 KG vs PC Volume</h3>
            <div class="chart-controls">
                <button class="control-btn active" data-chart="kgpc" data-group="day">Day</button>
                <button class="control-btn" data-chart="kgpc" data-group="week">Week</button>
                <button class="control-btn" data-chart="kgpc" data-group="month">Month</button>
                <button class="control-btn" data-chart="kgpc" data-group="year">Year</button>
            </div>
            <div class="chart-wrapper">
                <canvas id="kgPcChart"></canvas>
            </div>
        </div>
    </div>
</div>
</body>
</html>
