<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="config.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            min-height: 100vh;
        }

        .dashboard-container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Header Section */
        .dashboard-header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        }

        .dashboard-header h1 {
            color: #333;
            margin-bottom: 25px;
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .kpi-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .kpi-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }

        .kpi-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
        }

        .kpi-card.kpi-secondary {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .kpi-card.kpi-tertiary {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }

        .kpi-card.kpi-quaternary {
            background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
        }

        .kpi-card.kpi-quinary {
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
        }

        .kpi-label {
            font-size: 12px;
            opacity: 0.9;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .kpi-value {
            font-size: 28px;
            font-weight: 700;
            line-height: 1.2;
        }

        /* Charts Section */
        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(700px, 1fr));
            gap: 25px;
            margin-bottom: 30px;
        }

        @media (max-width: 1400px) {
            .charts-grid {
                grid-template-columns: 1fr;
            }
        }

        .chart-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            transition: box-shadow 0.3s ease;
        }

        .chart-card:hover {
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
        }

        .chart-card h3 {
            color: #333;
            margin-bottom: 20px;
            font-size: 18px;
            font-weight: 700;
            border-bottom: 3px solid #667eea;
            padding-bottom: 12px;
        }

        .chart-controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .control-btn {
            padding: 8px 16px;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            font-size: 13px;
        }

        .control-btn:hover {
            background: #f0f0f0;
            transform: translateY(-2px);
        }

        .control-btn.active {
            background: #667eea;
            color: white;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        canvas {
            width: 100% !important;
            height: 300px !important;
        }

        .chart-wrapper {
            position: relative;
            min-height: 350px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .dashboard-header h1 {
                font-size: 24px;
                margin-bottom: 20px;
            }

            .kpi-container {
                grid-template-columns: repeat(2, 1fr);
            }

            .kpi-card {
                padding: 18px;
            }

            .kpi-value {
                font-size: 22px;
            }

            .chart-controls {
                gap: 8px;
            }

            .control-btn {
                padding: 6px 12px;
                font-size: 11px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
            }

            .dashboard-header {
                padding: 15px;
            }

            .kpi-container {
                grid-template-columns: 1fr;
            }

            .chart-card {
                padding: 15px;
            }
        }
    </style>
    <script>
        let chartInstances = {};
        let rawData = null;

        async function fetchData() {
            try {
                let response = await fetch(API_URL, {
                    method: 'POST',
                    body: new URLSearchParams({
                        operations: JSON.stringify([{
                            opCode: "FETCH_ALL",
                            sheetId: "11TA2pPlxqajVwkPEigNMPNfsV-12CExxmySk1OMw_v8",
                            tabName: "cumilativeCalculations",
                            opId: "f6893973-f58c-4c10-a219-d9b281138026-1740944738031"
                        }])
                    })
                });

                rawData = await response.json();
                updateDashboard();

            } catch (error) {
                console.error("Error fetching data:", error);
            }
        }

        function updateDashboard() {
            updateKPIs();
            updateProfitChart('month');
            updateExpensesChart('month');
            updateDueBalanceChart('month');
            updateProfitPerKgChart('month');
            updateTotalExpensesChart('month');
            updateKgComparisonChart('week');
            updateProfitComparisonChart('week');
        }

        function getMonthName(monthIndex) {
            return ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"][monthIndex];
        }

        function getWeek(date) {
            let firstDay = new Date(date.getFullYear(), 0, 1);
            return Math.ceil((((date - firstDay) / 86400000) + firstDay.getDay() + 1) / 7);
        }

        function formatDate(date, groupBy, includeYear = true) {
            switch(groupBy) {
                case 'day':
                    let dayStr = `${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
                    return includeYear ? `${date.getFullYear()}-${dayStr}` : dayStr;
                case 'week':
                    let weekStr = `W${getWeek(date)}`;
                    return includeYear ? `${date.getFullYear()} ${weekStr}` : weekStr;
                case 'month':
                    let monthStr = `${getMonthName(date.getMonth())}`;
                    return includeYear ? `${monthStr} ${date.getFullYear()}` : monthStr;
                case 'year':
                    return `${date.getFullYear()}`;
                default:
                    return '';
            }
        }

        function updateKPIs() {
            if (!rawData) return;

            let totalDeliveredKg = 0;
            let latestDueBalance = 0;
            let totalProfit = 0;
            let totalKg = 0;
            let totalTrips = 0;

            rawData[0].content.forEach(entry => {
                if (entry.deliveredKg && entry.deliveredKg !== "#N/A") totalDeliveredKg += parseFloat(entry.deliveredKg) || 0;
                if (entry.new_due_balance && entry.new_due_balance !== "#N/A") latestDueBalance = parseFloat(entry.new_due_balance) || 0;
                if (entry.profit && entry.profit !== "#N/A") totalProfit += parseFloat(entry.profit) || 0;
                if (entry.kg && entry.kg !== "#N/A") totalKg += parseFloat(entry.kg) || 0;
                totalTrips++;
            });

            let soldAmount = 0;
            rawData[0].content.forEach(entry => {
                if (entry.sold_amount && entry.sold_amount !== "#N/A") soldAmount += parseFloat(entry.sold_amount) || 0;
            });

            let profitMargin = soldAmount > 0 ? ((totalProfit / soldAmount) * 100).toFixed(2) : 0;

            document.getElementById('deliveredKg').textContent = `${totalDeliveredKg.toLocaleString('en-IN', {maximumFractionDigits: 1})} KG`;
            document.getElementById('dueBalance').textContent = `₹${latestDueBalance.toLocaleString('en-IN', {maximumFractionDigits: 0})}`;
            document.getElementById('profitMargin').textContent = `${profitMargin}%`;
            document.getElementById('totalKgHandled').textContent = `${totalKg.toLocaleString('en-IN', {maximumFractionDigits: 1})} KG`;
            document.getElementById('totalTrips').textContent = `${totalTrips}`;
        }

        function groupDataByPeriod(groupBy, field) {
            let grouped = {};
            let dateMap = {};

            rawData[0].content.forEach(entry => {
                if (!entry.date) return;

                let date = new Date(entry.date);
                if (isNaN(date.getTime())) return;

                let key = formatDate(date, groupBy);
                if (!grouped[key]) {
                    grouped[key] = 0;
                    dateMap[key] = date;
                }

                let value = parseFloat(entry[field]) || 0;
                if (entry[field] !== "#N/A") {
                    grouped[key] += value;
                }
            });

            let labels = Object.keys(grouped).sort((a, b) => dateMap[a] - dateMap[b]);
            let values = labels.map(label => grouped[label]);

            return { labels, values, dateMap };
        }

        function destroyChart(chartId) {
            if (chartInstances[chartId]) {
                chartInstances[chartId].destroy();
            }
        }

        function updateProfitChart(groupBy) {
            if (!rawData) return;

            let { labels, values } = groupDataByPeriod(groupBy, 'profit');

            let ctx = document.getElementById('profitChart');
            if (!ctx) return;

            destroyChart('profitChart');

            chartInstances['profitChart'] = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Profit',
                        data: values,
                        borderColor: 'rgba(102, 126, 234, 1)',
                        backgroundColor: 'rgba(102, 126, 234, 0.1)',
                        borderWidth: 3,
                        tension: 0.4,
                        fill: true,
                        pointRadius: 2,
                        pointBackgroundColor: 'rgba(102, 126, 234, 1)',
                        pointBorderColor: '#fff',
                        pointBorderWidth: 1,
                        pointHoverRadius: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: {
                        mode: 'index',
                        intersect: false
                    },
                    plugins: {
                        legend: {
                            display: true,
                            labels: { font: { size: 12, weight: 'bold' } }
                        }
                    },
                    scales: {
                        y: { beginAtZero: true, grid: { drawBorder: false } }
                    }
                }
            });
        }

        function updateExpensesChart(groupBy) {
            if (!rawData) return;

            let groupedCar = {};
            let groupedLabour = {};
            let groupedExtra = {};
            let dateMap = {};

            rawData[0].content.forEach(entry => {
                if (!entry.date) return;
                let date = new Date(entry.date);
                if (isNaN(date.getTime())) return;

                let key = formatDate(date, groupBy);
                if (!groupedCar[key]) {
                    groupedCar[key] = 0;
                    groupedLabour[key] = 0;
                    groupedExtra[key] = 0;
                    dateMap[key] = date;
                }

                groupedCar[key] += parseFloat(entry.car_expense) || 0;
                groupedLabour[key] += parseFloat(entry.labour_expense) || 0;
                groupedExtra[key] += parseFloat(entry.extra_expenses) || 0;
            });

            let labels = Object.keys(groupedCar).sort((a, b) => dateMap[a] - dateMap[b]);

            let ctx = document.getElementById('expensesChart');
            if (!ctx) return;

            destroyChart('expensesChart');

            chartInstances['expensesChart'] = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: 'Car Expense',
                            data: labels.map(l => groupedCar[l]),
                            borderColor: 'rgba(245, 87, 108, 1)',
                            backgroundColor: 'rgba(245, 87, 108, 0.1)',
                            borderWidth: 3,
                            tension: 0.4,
                            fill: true,
                            pointRadius: 2,
                            pointBackgroundColor: 'rgba(245, 87, 108, 1)'
                        },
                        {
                            label: 'Labour Expense',
                            data: labels.map(l => groupedLabour[l]),
                            borderColor: 'rgba(255, 165, 0, 1)',
                            backgroundColor: 'rgba(255, 165, 0, 0.1)',
                            borderWidth: 3,
                            tension: 0.4,
                            fill: true,
                            pointRadius: 2,
                            pointBackgroundColor: 'rgba(255, 165, 0, 1)'
                        },
                        {
                            label: 'Extra Expense',
                            data: labels.map(l => groupedExtra[l]),
                            borderColor: 'rgba(155, 89, 182, 1)',
                            backgroundColor: 'rgba(155, 89, 182, 0.1)',
                            borderWidth: 3,
                            tension: 0.4,
                            fill: true,
                            pointRadius: 2,
                            pointBackgroundColor: 'rgba(155, 89, 182, 1)'
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: {
                        mode: 'index',
                        intersect: false
                    },
                    plugins: {
                        legend: {
                            display: true,
                            labels: { font: { size: 12, weight: 'bold' } }
                        }
                    },
                    scales: {
                        y: { beginAtZero: true, grid: { drawBorder: false } }
                    }
                }
            });
        }

        function updateDueBalanceChart(groupBy) {
            if (!rawData) return;

            let dueBalances = [];
            let dateMap = {};

            rawData[0].content.forEach(entry => {
                if (!entry.date || !entry.new_due_balance || entry.new_due_balance === "#N/A") return;

                let date = new Date(entry.date);
                if (isNaN(date.getTime())) return;

                dueBalances.push({
                    date: date,
                    balance: parseFloat(entry.new_due_balance) || 0
                });
            });

            dueBalances.sort((a, b) => a.date - b.date);

            let labels = dueBalances.map(d => formatDate(d.date, groupBy));
            let values = dueBalances.map(d => d.balance);

            let ctx = document.getElementById('dueBalanceChart');
            if (!ctx) return;

            destroyChart('dueBalanceChart');

            chartInstances['dueBalanceChart'] = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Due Balance',
                        data: values,
                        borderColor: 'rgba(240, 147, 251, 1)',
                        backgroundColor: 'rgba(240, 147, 251, 0.1)',
                        borderWidth: 3,
                        tension: 0.4,
                        fill: true,
                        pointRadius: 2,
                        pointBackgroundColor: 'rgba(240, 147, 251, 1)',
                        pointBorderColor: '#fff',
                        pointBorderWidth: 1,
                        pointHoverRadius: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: {
                        mode: 'index',
                        intersect: false
                    },
                    plugins: {
                        legend: {
                            display: true,
                            labels: { font: { size: 12, weight: 'bold' } }
                        }
                    },
                    scales: { y: { beginAtZero: false, grid: { drawBorder: false } } }
                }
            });
        }

        function updateProfitPerKgChart(groupBy) {
            if (!rawData) return;

            let groupedProfit = {};
            let groupedKg = {};
            let dateMap = {};

            rawData[0].content.forEach(entry => {
                if (!entry.date) return;
                let date = new Date(entry.date);
                if (isNaN(date.getTime())) return;

                let key = formatDate(date, groupBy);
                if (!groupedProfit[key]) {
                    groupedProfit[key] = 0;
                    groupedKg[key] = 0;
                    dateMap[key] = date;
                }

                groupedProfit[key] += parseFloat(entry.profit) || 0;
                groupedKg[key] += parseFloat(entry.kg) || 0;
            });

            let labels = Object.keys(groupedProfit).sort((a, b) => dateMap[a] - dateMap[b]);
            let profitPerKg = labels.map(l => groupedKg[l] > 0 ? (groupedProfit[l] / groupedKg[l]).toFixed(2) : 0);

            let ctx = document.getElementById('profitPerKgChart');
            if (!ctx) return;

            destroyChart('profitPerKgChart');

            chartInstances['profitPerKgChart'] = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Profit per KG',
                        data: profitPerKg,
                        borderColor: 'rgba(76, 175, 80, 1)',
                        backgroundColor: 'rgba(76, 175, 80, 0.1)',
                        borderWidth: 3,
                        tension: 0.4,
                        fill: true,
                        pointRadius: 2,
                        pointBackgroundColor: 'rgba(76, 175, 80, 1)',
                        pointBorderColor: '#fff',
                        pointBorderWidth: 1,
                        pointHoverRadius: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: {
                        mode: 'index',
                        intersect: false
                    },
                    plugins: {
                        legend: {
                            display: true,
                            labels: { font: { size: 12, weight: 'bold' } }
                        }
                    },
                    scales: {
                        y: { beginAtZero: false, grid: { drawBorder: false } }
                    }
                }
            });
        }

        function updateTotalExpensesChart(groupBy) {
            if (!rawData) return;

            let groupedTotal = {};
            let dateMap = {};

            rawData[0].content.forEach(entry => {
                if (!entry.date) return;
                let date = new Date(entry.date);
                if (isNaN(date.getTime())) return;

                let key = formatDate(date, groupBy);
                if (!groupedTotal[key]) {
                    groupedTotal[key] = 0;
                    dateMap[key] = date;
                }

                let car = parseFloat(entry.car_expense) || 0;
                let labour = parseFloat(entry.labour_expense) || 0;
                let extra = parseFloat(entry.extra_expenses) || 0;
                groupedTotal[key] += car + labour + extra;
            });

            let labels = Object.keys(groupedTotal).sort((a, b) => dateMap[a] - dateMap[b]);
            let values = labels.map(l => groupedTotal[l]);

            let ctx = document.getElementById('totalExpensesChart');
            if (!ctx) return;

            destroyChart('totalExpensesChart');

            chartInstances['totalExpensesChart'] = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Total Expenses',
                        data: values,
                        borderColor: 'rgba(229, 57, 53, 1)',
                        backgroundColor: 'rgba(229, 57, 53, 0.1)',
                        borderWidth: 3,
                        tension: 0.4,
                        fill: true,
                        pointRadius: 2,
                        pointBackgroundColor: 'rgba(229, 57, 53, 1)',
                        pointBorderColor: '#fff',
                        pointBorderWidth: 1,
                        pointHoverRadius: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: {
                        mode: 'index',
                        intersect: false
                    },
                    plugins: {
                        legend: {
                            display: true,
                            labels: { font: { size: 12, weight: 'bold' } }
                        }
                    },
                    scales: {
                        y: { beginAtZero: true, grid: { drawBorder: false } }
                    }
                }
            });
        }

        function groupDataByPeriodMultiYear(groupBy, field) {
            let grouped = {};
            let yearsSet = new Set();
            let dateMap = {};

            rawData[0].content.forEach(entry => {
                if (!entry.date || !entry[field] || entry[field] === "#N/A") return;

                let date = new Date(entry.date);
                if (isNaN(date.getTime())) return;

                // Use formatDate without year for overlapping dates across years
                let key = formatDate(date, groupBy, false);
                let year = date.getFullYear();

                yearsSet.add(year);

                if (!dateMap[key]) {
                    dateMap[key] = date;
                }

                if (!grouped[key]) {
                    grouped[key] = {};
                }
                if (!grouped[key][year]) {
                    grouped[key][year] = 0;
                }

                grouped[key][year] += parseFloat(entry[field]) || 0;
            });

            return { grouped, yearsSet: [...yearsSet].sort(), dateMap };
        }

        function getGradientColor(index, total) {
            // Option 3: Opacity Gradient for Criss-Crossing Lines
            // Recent years more opaque (bolder), older years faded
            // Gray → Gold → Orange → Red with progressive opacity

            const colorPalette = ['#B0BEC5', '#FFB74D', '#FF7043', '#EF5350'];
            const opacities = [0.4, 0.65, 0.85, 1.0];

            let colorIndex = Math.min(index, colorPalette.length - 1);
            let opacityIndex = Math.min(index, opacities.length - 1);

            const color = colorPalette[colorIndex];
            const opacity = opacities[opacityIndex];

            // Convert hex to RGB and apply opacity
            const rgb = parseInt(color.slice(1), 16);
            const r = (rgb >> 16) & 255;
            const g = (rgb >> 8) & 255;
            const b = rgb & 255;

            return `rgba(${r}, ${g}, ${b}, ${opacity})`;
        }

        function getFillOpacity(index) {
            // Fill opacity increases for recent years (very subtle to prominent)
            const fillOpacities = [0.06, 0.10, 0.15, 0.22];
            return fillOpacities[Math.min(index, fillOpacities.length - 1)];
        }

        function getColorBase(index) {
            // Get base color without opacity for use in creating fill colors
            const colorPalette = ['#B0BEC5', '#FFB74D', '#FF7043', '#EF5350'];
            return colorPalette[Math.min(index, colorPalette.length - 1)];
        }

        function sortLabels(labels, groupBy, dateMap) {
            return labels.sort((a, b) => {
                if (groupBy === 'day') {
                    let monthDayA = a.split('-');
                    let monthDayB = b.split('-');
                    let monthA = parseInt(monthDayA[0]);
                    let monthB = parseInt(monthDayB[0]);
                    if (monthA !== monthB) return monthA - monthB;
                    return parseInt(monthDayA[1]) - parseInt(monthDayB[1]);
                } else if (groupBy === 'week') {
                    let aWeek = parseInt(a.substring(1));
                    let bWeek = parseInt(b.substring(1));
                    return aWeek - bWeek;
                } else if (groupBy === 'month') {
                    let monthOrder = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
                    return monthOrder.indexOf(a) - monthOrder.indexOf(b);
                } else if (groupBy === 'year') {
                    return parseInt(a) - parseInt(b);
                }
                return 0;
            });
        }

        function updateKgComparisonChart(groupBy) {
            if (!rawData) return;

            let { grouped, yearsSet, dateMap } = groupDataByPeriodMultiYear(groupBy, 'kg');

            let allKeys = Object.keys(grouped);
            let labels = sortLabels(allKeys, groupBy, dateMap);

            let datasets = yearsSet.map((year, index) => {
                const lineColor = getGradientColor(index, yearsSet.length);
                const baseColor = getColorBase(index);
                const fillOpacity = getFillOpacity(index);

                // Convert hex to RGB for fill
                const rgb = parseInt(baseColor.slice(1), 16);
                const r = (rgb >> 16) & 255;
                const g = (rgb >> 8) & 255;
                const b = rgb & 255;
                const fillColor = `rgba(${r}, ${g}, ${b}, ${fillOpacity})`;

                return {
                    label: `Year ${year}`,
                    data: labels.map(label => grouped[label][year] || 0),
                    borderColor: lineColor,
                    backgroundColor: fillColor,
                    pointBackgroundColor: lineColor,
                    borderWidth: 3,
                    tension: 0.4,
                    fill: true,
                    pointRadius: 2,
                    pointBorderColor: '#fff',
                    pointBorderWidth: 1,
                    pointHoverRadius: 4
                };
            });

            let ctx = document.getElementById('kgComparisonChart');
            if (!ctx) return;

            destroyChart('kgComparisonChart');

            chartInstances['kgComparisonChart'] = new Chart(ctx, {
                type: 'line',
                data: { labels: labels, datasets: datasets },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: {
                        mode: 'index',
                        intersect: false
                    },
                    plugins: {
                        legend: {
                            display: true,
                            labels: { font: { size: 12, weight: 'bold' } }
                        }
                    },
                    scales: { y: { beginAtZero: true, grid: { drawBorder: false } } }
                }
            });
        }

        function updateProfitComparisonChart(groupBy) {
            if (!rawData) return;

            let { grouped, yearsSet, dateMap } = groupDataByPeriodMultiYear(groupBy, 'profit');

            let allKeys = Object.keys(grouped);
            let labels = sortLabels(allKeys, groupBy, dateMap);

            let datasets = yearsSet.map((year, index) => {
                const lineColor = getGradientColor(index, yearsSet.length);
                const baseColor = getColorBase(index);
                const fillOpacity = getFillOpacity(index);

                // Convert hex to RGB for fill
                const rgb = parseInt(baseColor.slice(1), 16);
                const r = (rgb >> 16) & 255;
                const g = (rgb >> 8) & 255;
                const b = rgb & 255;
                const fillColor = `rgba(${r}, ${g}, ${b}, ${fillOpacity})`;

                return {
                    label: `Year ${year}`,
                    data: labels.map(label => grouped[label][year] || 0),
                    borderColor: lineColor,
                    backgroundColor: fillColor,
                    pointBackgroundColor: lineColor,
                    borderWidth: 3,
                    tension: 0.4,
                    fill: true,
                    pointRadius: 2,
                    pointBorderColor: '#fff',
                    pointBorderWidth: 1,
                    pointHoverRadius: 4
                };
            });

            let ctx = document.getElementById('profitComparisonChart');
            if (!ctx) return;

            destroyChart('profitComparisonChart');

            chartInstances['profitComparisonChart'] = new Chart(ctx, {
                type: 'line',
                data: { labels: labels, datasets: datasets },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: {
                        mode: 'index',
                        intersect: false
                    },
                    plugins: {
                        legend: {
                            display: true,
                            labels: { font: { size: 12, weight: 'bold' } }
                        }
                    },
                    scales: { y: { beginAtZero: true, grid: { drawBorder: false } } }
                }
            });
        }

        function setupControls() {
            document.querySelectorAll('.control-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    let chartType = this.dataset.chart;
                    let groupBy = this.dataset.group;

                    document.querySelectorAll(`.control-btn[data-chart="${chartType}"]`).forEach(b => {
                        b.classList.remove('active');
                    });
                    this.classList.add('active');

                    if (chartType === 'profit') updateProfitChart(groupBy);
                    else if (chartType === 'expenses') updateExpensesChart(groupBy);
                    else if (chartType === 'dueBalance') updateDueBalanceChart(groupBy);
                    else if (chartType === 'profitPerKg') updateProfitPerKgChart(groupBy);
                    else if (chartType === 'totalExpenses') updateTotalExpensesChart(groupBy);
                    else if (chartType === 'kgComparison') updateKgComparisonChart(groupBy);
                    else if (chartType === 'profitComparison') updateProfitComparisonChart(groupBy);
                });
            });
        }

        document.addEventListener("DOMContentLoaded", function() {
            setupControls();
        });
    </script>
</head>
