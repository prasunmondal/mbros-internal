<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profit Report</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="config.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 100%;
            margin: auto;
        }
        .card {
            background: white;
            padding: 20px;
            margin: 10px 0;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .collapsible {
            background: #007bff;
            color: white;
            cursor: pointer;
            padding: 10px;
            width: 100%;
            border: none;
            text-align: left;
            font-size: 16px;
            border-radius: 5px;
            transition: background 0.3s;
        }
        .collapsible:hover {
            background: #0056b3;
        }
        .content {
            display: none;
            padding: 10px;
        }
        .grouping-controls {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .group-btn {
            padding: 8px 16px;
            border: 2px solid #007bff;
            background: white;
            color: #007bff;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }
        .group-btn:hover {
            background: #e7f1ff;
        }
        .group-btn.active {
            background: #007bff;
            color: white;
        }
        canvas {
            width: 100% !important;
            height: 300px !important;
        }
        .chart-wrapper {
            position: relative;
        }
    </style>
    <script>
        let chartInstances = {
            profitChart: null,
            kgChart: null,
            profitYearChart: null
        };

        let rawData = null;

        async function fetchData() {
            try {
                let response = await fetch(API_URL, {
                    method: 'POST',
                    body: new URLSearchParams({
                        operations: JSON.stringify([{
                            opCode: "FETCH_ALL",
                            sheetId: "11TA2pPlxqajVwkPEigNMPNfsV-12CExxmySk1OMw_v8",
                            tabName: "cumilativeCalculations",
                            opId: "f6893973-f58c-4c10-a219-d9b281138026-1740944738031"
                        }])
                    })
                });

                rawData = await response.json();

                // Initial render with default grouping
                updateProfitChart('month');
                updateKgChart('week');
                updateProfitByYearChart('week');

            } catch (error) {
                console.error("Error fetching data:", error);
            }
        }

        function getMonthName(monthIndex) {
            return ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"][monthIndex];
        }

        function getWeek(date) {
            let firstDay = new Date(date.getFullYear(), 0, 1);
            return Math.ceil((((date - firstDay) / 86400000) + firstDay.getDay() + 1) / 7);
        }

        function formatDate(date, groupBy, includeYear = true) {
            switch(groupBy) {
                case 'day':
                    let dayStr = `${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
                    return includeYear ? `${date.getFullYear()}-${dayStr}` : dayStr;
                case 'week':
                    let weekStr = `W${getWeek(date)}`;
                    return includeYear ? `${date.getFullYear()} ${weekStr}` : weekStr;
                case 'month':
                    return `${getMonthName(date.getMonth())}`;
                case 'year':
                    return `${date.getFullYear()}`;
                default:
                    return '';
            }
        }

        function groupDataByPeriod(data, groupBy) {
            let grouped = {};
            let dateMap = {};

            data[0].content.forEach(entry => {
                if (!entry.date || !entry.profit || entry.profit === "#N/A") return;

                let date = new Date(entry.date);
                if (isNaN(date.getTime())) return;

                let key = formatDate(date, groupBy);
                let year = date.getFullYear();

                if (!grouped[key]) {
                    grouped[key] = 0;
                    dateMap[key] = date;
                }

                grouped[key] += parseFloat(entry.profit) || 0;
            });

            return { grouped, dateMap };
        }

        function groupDataByPeriodMultiYear(data, groupBy) {
            let grouped = {};
            let yearsSet = new Set();
            let keyToDate = {};

            data[0].content.forEach(entry => {
                if (!entry.date || !entry.profit || entry.profit === "#N/A") return;

                let date = new Date(entry.date);
                if (isNaN(date.getTime())) return;

                let key = formatDate(date, groupBy, false); // Without year for overlapping
                let year = date.getFullYear();

                yearsSet.add(year);

                if (!keyToDate[key]) {
                    keyToDate[key] = date;
                }

                if (!grouped[key]) {
                    grouped[key] = {};
                }
                if (!grouped[key][year]) {
                    grouped[key][year] = 0;
                }

                grouped[key][year] += parseFloat(entry.profit) || 0;
            });

            return { grouped, yearsSet: [...yearsSet].sort(), keyToDate };
        }

        function groupKgByPeriodMultiYear(data, groupBy) {
            let grouped = {};
            let yearsSet = new Set();
            let keyToDate = {};

            data[0].content.forEach(entry => {
                if (!entry.date || !entry.kg || entry.kg === "#N/A") return;

                let date = new Date(entry.date);
                if (isNaN(date.getTime())) return;

                let key = formatDate(date, groupBy, false); // Without year for overlapping
                let year = date.getFullYear();

                yearsSet.add(year);

                if (!keyToDate[key]) {
                    keyToDate[key] = date;
                }

                if (!grouped[key]) {
                    grouped[key] = {};
                }
                if (!grouped[key][year]) {
                    grouped[key][year] = 0;
                }

                grouped[key][year] += parseFloat(entry.kg) || 0;
            });

            return { grouped, yearsSet: [...yearsSet].sort(), keyToDate };
        }

        function updateProfitChart(groupBy) {
            if (!rawData) return;

            let { grouped, dateMap } = groupDataByPeriod(rawData, groupBy);

            // Sort labels based on groupBy type
            let labels = Object.keys(grouped).sort((a, b) => {
                if (groupBy === 'day' || groupBy === 'month') {
                    return dateMap[a] - dateMap[b];
                } else if (groupBy === 'week') {
                    let aParts = a.split(' ');
                    let bParts = b.split(' ');
                    let aYear = parseInt(aParts[0]);
                    let bYear = parseInt(bParts[0]);
                    if (aYear !== bYear) return aYear - bYear;
                    let aWeek = parseInt(aParts[1].substring(1));
                    let bWeek = parseInt(bParts[1].substring(1));
                    return aWeek - bWeek;
                } else if (groupBy === 'year') {
                    return parseInt(a) - parseInt(b);
                }
                return 0;
            });

            let values = labels.map(label => grouped[label]);

            let ctx = document.getElementById('profitChart').getContext('2d');

            if (chartInstances.profitChart) {
                chartInstances.profitChart.destroy();
            }

            chartInstances.profitChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: `Profit (Grouped by ${groupBy})`,
                        data: values,
                        backgroundColor: 'rgba(75, 192, 192, 0.6)',
                        borderColor: 'rgba(75, 192, 192, 1)',
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            beginAtZero: true
                        }
                    }
                }
            });
        }

        function updateKgChart(groupBy) {
            if (!rawData) return;

            let { grouped, yearsSet, keyToDate } = groupKgByPeriodMultiYear(rawData, groupBy);

            let allKeys = Object.keys(grouped);
            let labels = allKeys.sort((a, b) => {
                if (groupBy === 'day') {
                    let monthDayA = a.split('-');
                    let monthDayB = b.split('-');
                    let monthA = parseInt(monthDayA[0]);
                    let monthB = parseInt(monthDayB[0]);
                    if (monthA !== monthB) return monthA - monthB;
                    return parseInt(monthDayA[1]) - parseInt(monthDayB[1]);
                } else if (groupBy === 'week') {
                    let aWeek = parseInt(a.substring(1));
                    let bWeek = parseInt(b.substring(1));
                    return aWeek - bWeek;
                } else if (groupBy === 'month') {
                    let monthOrder = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
                    return monthOrder.indexOf(a) - monthOrder.indexOf(b);
                } else if (groupBy === 'year') {
                    return parseInt(a) - parseInt(b);
                }
                return 0;
            });

            function getGradientColor(index, total) {
                if (total === 1) return "rgb(255, 165, 0)";
                let ratio = index / (total - 1);
                let r = Math.round(255);
                let g = Math.round(255 * (1 - ratio));
                let b = 0;
                return `rgb(${r}, ${g}, ${b})`;
            }

            let datasets = yearsSet.map((year, index) => ({
                label: `Year ${year}`,
                data: labels.map(label => grouped[label][year] || 0),
                borderColor: getGradientColor(index, yearsSet.length),
                backgroundColor: getGradientColor(index, yearsSet.length),
                pointBackgroundColor: getGradientColor(index, yearsSet.length),
                fill: false,
                tension: 0.1
            }));

            let ctx = document.getElementById('kgChart').getContext('2d');

            if (chartInstances.kgChart) {
                chartInstances.kgChart.destroy();
            }

            chartInstances.kgChart = new Chart(ctx, {
                type: 'line',
                data: { labels: labels, datasets: datasets },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: { y: { beginAtZero: true } }
                }
            });
        }

        function updateProfitByYearChart(groupBy) {
            if (!rawData) return;

            let { grouped, yearsSet, keyToDate } = groupDataByPeriodMultiYear(rawData, groupBy);

            let allKeys = Object.keys(grouped);
            let labels = allKeys.sort((a, b) => {
                if (groupBy === 'day') {
                    let monthDayA = a.split('-');
                    let monthDayB = b.split('-');
                    let monthA = parseInt(monthDayA[0]);
                    let monthB = parseInt(monthDayB[0]);
                    if (monthA !== monthB) return monthA - monthB;
                    return parseInt(monthDayA[1]) - parseInt(monthDayB[1]);
                } else if (groupBy === 'week') {
                    let aWeek = parseInt(a.substring(1));
                    let bWeek = parseInt(b.substring(1));
                    return aWeek - bWeek;
                } else if (groupBy === 'month') {
                    let monthOrder = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
                    return monthOrder.indexOf(a) - monthOrder.indexOf(b);
                } else if (groupBy === 'year') {
                    return parseInt(a) - parseInt(b);
                }
                return 0;
            });

            function getGradientColor(index, total) {
                if (total === 1) return "rgb(255, 165, 0)";
                let ratio = index / (total - 1);
                let r = 255;
                let g = Math.round(255 * (1 - ratio));
                let b = 0;
                return `rgb(${r}, ${g}, ${b})`;
            }

            let datasets = yearsSet.map((year, index) => ({
                label: `Year ${year}`,
                data: labels.map(label => grouped[label][year] || 0),
                borderColor: getGradientColor(index, yearsSet.length),
                backgroundColor: getGradientColor(index, yearsSet.length),
                pointBackgroundColor: getGradientColor(index, yearsSet.length),
                fill: false,
                tension: 0.1
            }));

            let ctx = document.getElementById('profitYearChart').getContext('2d');

            if (chartInstances.profitYearChart) {
                chartInstances.profitYearChart.destroy();
            }

            chartInstances.profitYearChart = new Chart(ctx, {
                type: 'line',
                data: { labels: labels, datasets: datasets },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: { y: { beginAtZero: true } }
                }
            });
        }

        function setupGroupingControls() {
            document.querySelectorAll('.group-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    let chartId = this.dataset.chart;
                    let groupBy = this.dataset.group;

                    // Update active state
                    document.querySelectorAll(`.group-btn[data-chart="${chartId}"]`).forEach(b => {
                        b.classList.remove('active');
                    });
                    this.classList.add('active');

                    // Update chart
                    if (chartId === 'profit') {
                        updateProfitChart(groupBy);
                    } else if (chartId === 'kg') {
                        updateKgChart(groupBy);
                    } else if (chartId === 'profitYear') {
                        updateProfitByYearChart(groupBy);
                    }
                });
            });
        }

        document.addEventListener("DOMContentLoaded", function () {
            // Setup collapsibles
            let collapsibles = document.querySelectorAll(".collapsible");
            collapsibles.forEach(button => {
                button.addEventListener("click", function () {
                    let content = this.nextElementSibling;
                    content.style.display = content.style.display === "block" ? "none" : "block";
                });
            });

            // Setup grouping controls
            setupGroupingControls();
        });
    </script>
</head>
<body onload="fetchData()">
<div class="container">

    <h1>Profit Report</h1>

    <!-- Last 18 Months Profit -->
    <div class="card">
        <button class="collapsible">
            Toggle Profit Chart
        </button>

        <div class="content">
            <div class="grouping-controls">
                <button class="group-btn active" data-chart="profit" data-group="day">Day</button>
                <button class="group-btn" data-chart="profit" data-group="week">Week</button>
                <button class="group-btn active" data-chart="profit" data-group="month">Month</button>
                <button class="group-btn" data-chart="profit" data-group="year">Year</button>
            </div>
            <div class="chart-wrapper">
                <canvas id="profitChart"></canvas>
            </div>
        </div>
    </div>


    <!-- KG Comparison -->
    <div class="card">
        <button class="collapsible">
            Toggle KG Chart
        </button>

        <div class="content">
            <div class="grouping-controls">
                <button class="group-btn" data-chart="kg" data-group="day">Day</button>
                <button class="group-btn active" data-chart="kg" data-group="week">Week</button>
                <button class="group-btn" data-chart="kg" data-group="month">Month</button>
                <button class="group-btn" data-chart="kg" data-group="year">Year</button>
            </div>
            <div class="chart-wrapper">
                <canvas id="kgChart"></canvas>
            </div>
        </div>
    </div>


    <!-- Profit Comparison Across Years -->
    <div class="card">
        <button class="collapsible">
            Toggle Profit Comparison by Year
        </button>

        <div class="content">
            <div class="grouping-controls">
                <button class="group-btn" data-chart="profitYear" data-group="day">Day</button>
                <button class="group-btn active" data-chart="profitYear" data-group="week">Week</button>
                <button class="group-btn" data-chart="profitYear" data-group="month">Month</button>
                <button class="group-btn" data-chart="profitYear" data-group="year">Year</button>
            </div>
            <div class="chart-wrapper">
                <canvas id="profitYearChart"></canvas>
            </div>
        </div>
    </div>

</div>
</body>
</html>
