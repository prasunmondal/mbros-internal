<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Day summary · Mondal Brothers</title>
    <link rel="icon" href="../../assets/img/favicon.svg" type="image/svg+xml">
    <link rel="manifest" href="../../manifest.webmanifest">
    <link rel="apple-touch-icon" href="../../assets/img/apple-touch-icon.png">
    <meta name="theme-color" content="#1f6f4a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="MBros">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Bengali:wght@400;600&display=swap">
    <link rel="stylesheet" href="../../assets/css/site.css">
    <script src="../../assets/js/common.js"></script>
    <style>
        .day-nav { display: flex; gap: 8px; align-items: flex-end; }
        .facts td:first-child { color: var(--text-muted); }
        .facts td.num { font-weight: 600; }
        .facts tr.total-row td { color: var(--text); }
        .notes-list { margin: 0; padding: 16px 20px 16px 36px; }
        .notes-list li + li { margin-top: 6px; }
        .day-title { margin-top: 4px; color: var(--text-muted); }
        .table td.negative { color: var(--danger); }
        .date-entry { position: relative; display: flex; }
        .date-entry .input { width: 100%; padding-right: 44px; font-variant-numeric: tabular-nums; }
        .date-entry .input[aria-invalid="true"] { border-color: var(--danger); }
        .date-pick {
            position: absolute; top: 0; right: 0; bottom: 0; width: 42px; display: grid; place-items: center;
            color: var(--text-muted); border-left: 1px solid var(--border);
        }
        .date-pick svg { width: 18px; height: 18px; }
        .date-pick:hover { color: var(--brand); }
        .date-pick input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; border: 0; padding: 0; }
        .date-pick input::-webkit-calendar-picker-indicator { position: absolute; inset: 0; width: 100%; height: 100%; cursor: pointer; }
        .date-pick input:disabled { cursor: not-allowed; }
        /* Under the box without moving the Previous / Next buttons beside it. */
        .date-field { position: relative; }
        .field-error { position: absolute; top: 100%; left: 0; margin-top: 3px; font-size: 0.78rem; color: var(--danger); white-space: nowrap; }
        .customers-header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }
        /* Customers with a balance but no entry on the day (shown when "All balances" is on). */
        .table tr.idle-row td { color: var(--text-muted); }
        .table tr.idle-row td:first-child { font-style: italic; }
        @media print {
            .grid-2 { grid-template-columns: 1fr 1fr; }
            .table { font-size: 0.75rem; }
            .table th, .table td { padding: 5px 8px; }
        }
    </style>
</head>
<body data-page="daily">

<main class="app-main wide">
    <div class="container">

        <div class="page-header">
            <div>
                <h1>Day summary</h1>
                <p class="day-title" id="dayTitle">Loading, sales, expenses, profit and customer deliveries for one day.</p>
            </div>
            <div class="page-actions">
                <button type="button" class="btn btn-secondary btn-icon" id="printBtn" onclick="window.print()" disabled title="Print" aria-label="Print"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V3h12v6"/><rect x="6" y="14" width="12" height="7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/></svg></button>
            </div>
        </div>

        <div class="card card-body toolbar no-print">
            <div class="field date-field">
                <label for="dayInput">Date</label>
                <div class="date-entry">
                    <input type="text" id="dayInput" class="input" placeholder="yyyy-MM-dd" maxlength="10" inputmode="numeric"
                           autocomplete="off" spellcheck="false" aria-describedby="dayError" disabled>
                    <span class="date-pick" title="Pick a date">
                        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
                        <!-- The native picker sits invisibly over the icon, so tapping it opens the calendar on every device. -->
                        <input type="date" id="dayPicker" aria-label="Pick a date" tabindex="-1" disabled>
                    </span>
                </div>
                <span class="field-error" id="dayError" hidden></span>
            </div>
            <div class="day-nav">
                <button type="button" class="btn btn-secondary" id="prevDay" title="Previous day with data" disabled>‹ Previous</button>
                <button type="button" class="btn btn-secondary" id="nextDay" title="Next day with data" disabled>Next ›</button>
                <button type="button" class="btn btn-secondary" id="latestDay" disabled>Latest</button>
            </div>
        </div>

        <p id="status" class="status" hidden style="margin-top: 16px;"></p>

        <div id="report" hidden>
            <div class="grid grid-2 section">
                <section class="card">
                    <div class="card-header"><h2>Loading &amp; delivery</h2></div>
                    <div class="table-wrap"><table class="table facts" id="loadingTable"><tbody></tbody></table></div>
                </section>
                <section class="card">
                    <div class="card-header"><h2>Sales &amp; dues</h2></div>
                    <div class="table-wrap"><table class="table facts" id="salesTable"><tbody></tbody></table></div>
                </section>
                <section class="card">
                    <div class="card-header"><h2>Expenses &amp; profit</h2></div>
                    <div class="table-wrap"><table class="table facts" id="expenseTable"><tbody></tbody></table></div>
                </section>
                <section class="card">
                    <div class="card-header"><h2>Trip &amp; staff</h2></div>
                    <div class="table-wrap"><table class="table facts" id="tripTable"><tbody></tbody></table></div>
                </section>
            </div>

            <section class="card section" id="notesCard" hidden>
                <div class="card-header"><h2>Notes</h2></div>
                <ul class="notes-list" id="notesList"></ul>
            </section>

            <section class="card section">
                <div class="card-header customers-header">
                    <h2 id="customersTitle">Customers</h2>
                    <label class="toggle no-print" title="Also list customers who had no entry this day but still have a balance">
                        <input type="checkbox" id="showAllBalances" role="switch">
                        <span class="toggle-track" aria-hidden="true"></span>
                        <span>All non-zero balances</span>
                    </label>
                </div>
                <div class="table-wrap">
                    <table class="table" id="customerTable">
                        <thead>
                        <tr>
                            <th>Customer</th>
                            <th class="num">PC</th>
                            <th class="num">KG</th>
                            <th class="num">Rate</th>
                            <th class="num">Amount</th>
                            <th class="num">Paid cash</th>
                            <th class="num">Paid online</th>
                            <th class="num">Discount</th>
                            <th class="num">Previous balance</th>
                            <th class="num">Balance</th>
                        </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </section>
        </div>

    </div>
</main>

<script src="../../assets/js/config.js"></script>
<script>
    const ARCHIVE_SHEET_ID = "1-uKyCderO-4Zq-YRb8HEzPgbSZPJ_vdzWs2P3BqE2kw";  // 2023–2025 deliveries
    const CURRENT_START = '2026-01-01';   // first day in db2.deliveries; earlier days live in the archive

    const num = value => Number(value) || 0;
    // Newer rows hold YYYY-MM-DD; older ones a UTC timestamp of IST midnight.
    const dayOf = value => (typeof value === 'string' && value.length === 10) ? value : Mb.toISTDate(value);

    let daysByDate = new Map();       // date -> cumilativeCalculations rows (a few dates have two)
    let dates = [];                   // sorted dates that have a day row
    let deliveriesByDate = new Map(); // date -> delivery rows
    let archiveLoad = null;
    let archiveLoaded = false;

    async function fetchRows(spreadsheetId, worksheet) {
        const data = await callSheetsApi([{ type: "SELECT", spreadsheetId, worksheet, id: "mbros-github-site" }]);
        return data[0].rows;
    }

    function addDeliveries(rows) {
        rows.filter(row => row.name).forEach(row => {
            const day = dayOf(row.timestamp);
            if (!deliveriesByDate.has(day)) deliveriesByDate.set(day, []);
            deliveriesByDate.get(day).push(row);
        });
    }

    // The archive is large, so it loads only when a day before 2026 is opened.
    function loadArchive() {
        archiveLoad ??= fetchRows(ARCHIVE_SHEET_ID, "deliveries.2023").then(rows => {
            // Days from 2026 come from db2.deliveries; dropping any archive overlap keeps them from counting twice.
            addDeliveries(rows.filter(row => row.timestamp && dayOf(row.timestamp) < CURRENT_START));
            archiveLoaded = true;
        }).catch(error => {
            archiveLoad = null;
            throw error;
        });
        return archiveLoad;
    }

    const inr = value => Mb.formatINR(value, 0);
    const kg = value => Mb.formatNumber(value, 3) + ' kg';
    const pc = value => Mb.formatNumber(value, 0) + ' pc';
    const text = value => String(value ?? '').trim();

    // Fill a label/value table; rows whose value is empty are skipped. A third item marks the total row.
    function fillFacts(id, facts) {
        const body = document.getElementById(id).tBodies[0];
        body.replaceChildren();
        facts.filter(([, value]) => value !== null && value !== '').forEach(([label, value, total]) => {
            const tr = body.insertRow();
            if (total) tr.className = 'total-row';
            tr.insertCell().textContent = label;
            const td = tr.insertCell();
            td.className = 'num';
            td.textContent = value;
        });
        if (!body.rows.length) {
            const td = body.insertRow().insertCell();
            td.colSpan = 2;
            td.className = 'muted';
            td.textContent = 'Nothing recorded.';
        }
    }

    // Sum a column over the day's rows, or null when no row has it (so the line is hidden).
    function sumOf(rows, key) {
        const values = rows.map(row => row[key]).filter(value => value !== '' && value !== null && value !== undefined);
        return values.length ? values.reduce((total, value) => total + num(value), 0) : null;
    }
    // Rates and percentages don't add up across rows; show the first recorded one.
    const firstNum = (rows, key) => { const value = firstOf(rows, key); return value ? num(value) : null; };
    const firstOf = (rows, key) => rows.map(row => text(row[key])).find(Boolean) || '';
    const fmt = (value, format) => value === null ? null : format(value);

    // "{Utpal|Driver|400}, {Jhantu|Loading+Delivery|350}" -> [['Utpal (Driver)', '₹400'], ...]
    function staffLines(value) {
        return [...text(value).matchAll(/\{([^}]*)\}/g)].map(match => {
            const [name, role, amount] = match[1].split('|').map(part => part.trim());
            return [`${name}${role ? ` (${role})` : ''}`, amount ? inr(amount) : '–'];
        });
    }

    function renderDay(date) {
        const status = document.getElementById('status');
        const report = document.getElementById('report');
        const days = daysByDate.get(date) || [];
        document.getElementById('printBtn').disabled = true;
        updateNav(date);
        history.replaceState(null, '', `?date=${date}`);

        if (date < CURRENT_START && !archiveLoaded) {
            Mb.setStatus(status, 'info', 'Loading 2023–2025 deliveries…');
            report.hidden = true;
            loadArchive().then(() => {
                if (document.getElementById('dayInput').value === date) renderDay(date);
            }, error => {
                console.error('Error fetching archive:', error);
                Mb.setStatus(status, 'error', 'Could not load 2023–2025 deliveries. Pick the date again to retry.');
            });
            return;
        }

        const deliveries = deliveriesByDate.get(date) || [];
        if (!days.length && !deliveries.length) {
            Mb.setStatus(status, 'empty', `Nothing recorded on ${date}.`);
            report.hidden = true;
            document.getElementById('dayTitle').textContent = formatLongDate(date);
            return;
        }
        Mb.setStatus(status, days.length > 1 ? 'empty' : null,
            `The sheet has ${days.length} day rows for ${date}; amounts below add them together.`);
        report.hidden = false;
        document.getElementById('dayTitle').textContent = formatLongDate(date);

        const loadedKg = sumOf(days, 'kg');
        const deliveredKg = sumOf(days, 'deliveredKg');
        fillFacts('loadingTable', [
            ['Loading company', [firstOf(days, 'loadingCompany'), firstOf(days, 'loadingBranch'), firstOf(days, 'loadingArea')].filter(Boolean).join(', ')],
            ['Farmer', firstOf(days, 'farmerName')],
            ['Farm rate', firstOf(days, 'finalFarmRate') || firstOf(days, 'farm_rate')],
            ['Loaded', fmt(sumOf(days, 'pc'), pc)],
            ['Loaded weight', fmt(loadedKg, kg)],
            ['Average bird weight', fmt(firstNum(days, 'avgLoadingWt'), value => Mb.formatNumber(value, 3) + ' kg')],
            ['Delivered', fmt(sumOf(days, 'deliveredPc'), pc)],
            ['Delivered weight', fmt(deliveredKg, kg)],
            ['Shortage', fmt(firstNum(days, 'shortage'), value => Mb.formatNumber(value, 2) + '%')]
        ]);

        fillFacts('salesTable', [
            ['Sold', fmt(sumOf(days, 'sold_amount'), inr)],
            ['Paid by customers', fmt(sumOf(days, 'paid_amount'), inr)],
            ['Discounts', fmt(sumOf(days, 'discounts'), inr)],
            ['Due before the day', fmt(num(days[0]?.prev_due_balance), inr)],
            ['Due after the day', fmt(num(days[days.length - 1]?.new_due_balance), inr), true]
        ].filter(() => days.length));

        fillFacts('expenseTable', [
            ['Car', fmt(sumOf(days, 'car_expense'), inr)],
            ['Labour', fmt(sumOf(days, 'labour_expense'), inr)],
            ['Extra', fmt(sumOf(days, 'extra_expenses'), inr)],
            ['Police', num(sumOf(days, 'police')) ? inr(sumOf(days, 'police')) : null],
            ['Other', num(sumOf(days, 'other_expense_amount')) ? inr(sumOf(days, 'other_expense_amount')) : null],
            ['Transport expenses', num(sumOf(days, 'transport_expenses')) ? inr(sumOf(days, 'transport_expenses')) : null],
            ['Total expenses', fmt(sumOf(days, 'total_expenses'), inr), true],
            ['Transport income', num(sumOf(days, 'transport_income')) ? inr(sumOf(days, 'transport_income')) : null],
            ['Profit', fmt(sumOf(days, 'profit'), inr), true]
        ]);

        fillFacts('tripTable', [
            ['Distance', fmt(sumOf(days, 'km'), value => Mb.formatNumber(value, 0) + ' km')],
            ['Odometer at end', fmt(num(days[days.length - 1]?.trip_end_km) || null, value => Mb.formatNumber(value, 0))],
            ['Supervisor', firstOf(days, 'supervisor')],
            ...days.flatMap(day => staffLines(day.employeeSalaries)),
            ['Raju salary', num(sumOf(days, 'RajuSalary')) ? inr(sumOf(days, 'RajuSalary')) : null]
        ]);

        const notes = days.flatMap(day => [
            text(day.Notes),
            text(day.other_expenses_note),
            text(day.police_breakdown) && `Police: ${text(day.police_breakdown)}`,
            text(day.adjustmentNote),
            text(day.occasion) && `Occasion: ${text(day.occasion)}`
        ]).filter(Boolean);
        const notesList = document.getElementById('notesList');
        notesList.replaceChildren(...notes.map(note => Object.assign(document.createElement('li'), { textContent: note })));
        document.getElementById('notesCard').hidden = !notes.length;

        renderCustomers(date);
        document.getElementById('printBtn').disabled = false;
    }

    // A row's balance: totalBalance, or khataBalance on an archive row without one.
    const balanceOf = row => (row.totalBalance === '' || row.totalBalance == null) ? num(row.khataBalance) : num(row.totalBalance);

    // Each customer's balance at the end of `date`: their last delivery row on or before it.
    function balancesOn(date) {
        const balances = new Map();
        [...deliveriesByDate.keys()].filter(day => day <= date).sort()
            .forEach(day => deliveriesByDate.get(day).forEach(row => balances.set(row.name, balanceOf(row))));
        return balances;
    }

    // Off (default): the day's delivery rows. On: also every customer with no entry that day whose balance
    // isn't zero, so the Balance total is everyone's dues at the end of the day.
    function renderCustomers(date) {
        const rows = deliveriesByDate.get(date) || [];
        const showAll = document.getElementById('showAllBalances').checked;
        const active = new Set(rows.map(row => row.name));
        const idle = showAll
            ? [...balancesOn(date)].filter(([name, balance]) => !active.has(name) && Math.round(balance) !== 0)
                .map(([name, balance]) => ({ name, balance, idle: true }))
            : [];
        const body = document.getElementById('customerTable').tBodies[0];
        body.replaceChildren();
        document.getElementById('customersTitle').textContent = showAll
            ? `Customers (${active.size} with entries, ${idle.length} more with a balance)`
            : `Customers (${rows.length})`;
        if (!rows.length && !idle.length) {
            const td = body.insertRow().insertCell();
            td.colSpan = 10;
            td.className = 'empty-state';
            td.textContent = showAll ? 'No customer has a balance or an entry on this day.' : 'No customer entries on this day.';
            return;
        }
        const blank = (value, decimals = 0) => num(value) ? Mb.formatNumber(value, decimals) : '';
        const totals = { pc: 0, kg: 0, amount: 0, cash: 0, online: 0, discount: 0, prev: 0, balance: 0 };
        [...rows, ...idle].sort((a, b) => a.name.localeCompare(b.name)).forEach(row => {
            if (row.idle) {
                // No entry today: the balance carried in is the balance carried out.
                totals.prev += row.balance;
                totals.balance += row.balance;
                const tr = body.insertRow();
                tr.className = 'idle-row';
                tr.title = 'No entry on this day';
                [row.name, '', '', '', '', '', '', '', Mb.formatNumber(row.balance, 0), Mb.formatNumber(row.balance, 0)].forEach((value, i) => {
                    const td = tr.insertCell();
                    td.textContent = value;
                    if (i) td.className = 'num';
                });
                if (row.balance < 0) tr.cells[9].classList.add('negative');
                return;
            }
            totals.pc += num(row.deliveredPc);
            totals.kg += num(row.deliveredKg);
            totals.amount += num(row.deliverAmount);
            totals.cash += num(row.paidCash);
            totals.online += num(row.paidOnline);
            totals.discount += num(row.discount);
            const previous = num(row.prevAmount) + num(row.totalBalance) - num(row.khataBalance);
            totals.prev += previous;
            totals.balance += num(row.totalBalance);
            const tr = body.insertRow();
            [row.name, blank(row.deliveredPc), blank(row.deliveredKg, 3), num(row.rate) ? Mb.formatRate(row.rate) : '', blank(row.deliverAmount),
                blank(row.paidCash), blank(row.paidOnline), blank(row.discount),
                Mb.formatNumber(previous, 0), Mb.formatNumber(row.totalBalance, 0)
            ].forEach((value, i) => {
                const td = tr.insertCell();
                td.textContent = value;
                if (i) td.className = 'num';
            });
            if (num(row.totalBalance) < 0) tr.cells[9].classList.add('negative');
        });
        const totalRow = body.insertRow();
        totalRow.className = 'total-row';
        ['Total', Mb.formatNumber(totals.pc, 0), Mb.formatNumber(totals.kg, 3), '', Mb.formatNumber(totals.amount, 0),
            Mb.formatNumber(totals.cash, 0), Mb.formatNumber(totals.online, 0), Mb.formatNumber(totals.discount, 0),
            Mb.formatNumber(totals.prev, 0), Mb.formatNumber(totals.balance, 0)
        ].forEach((value, i) => {
            const td = totalRow.insertCell();
            td.textContent = value;
            if (i) td.className = 'num';
        });
    }

    function formatLongDate(date) {
        return new Date(date + 'T00:00:00').toLocaleDateString('en-IN', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    }

    // Typed or pasted dates → yyyy-MM-dd, or null. Accepts yyyy-MM-dd (also with / or .), dd-MM-yyyy
    // (day first, as dates are written in India; also with / or .), single-digit day or month, and a full
    // ISO timestamp (its IST date). Rejects dates that don't exist, such as 2026-02-30.
    function parseDay(value) {
        const input = String(value || '').trim();
        if (!input) return null;
        if (/^\d{4}-\d{2}-\d{2}T/.test(input)) {
            const time = Date.parse(input);
            return Number.isNaN(time) ? null : Mb.toISTDate(time);
        }
        let match = input.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})$/), y, m, d;
        if (match) [, y, m, d] = match;
        else if ((match = input.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{4})$/))) [, d, m, y] = match;
        else if ((match = input.match(/^(\d{4})(\d{2})(\d{2})$/))) [, y, m, d] = match;
        else return null;
        const day = `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
        const check = new Date(day + 'T00:00:00Z');
        return !Number.isNaN(check.getTime()) && check.toISOString().slice(0, 10) === day ? day : null;
    }

    function showDayError(message) {
        const input = document.getElementById('dayInput'), error = document.getElementById('dayError');
        error.hidden = !message;
        error.textContent = message || '';
        input.setAttribute('aria-invalid', String(!!message));
    }

    // Go to the typed date, or say why not. Leaves the page as it is when the text is unchanged.
    function commitTypedDay() {
        const input = document.getElementById('dayInput');
        const day = parseDay(input.value);
        const text = input.value.trim();
        if (!day) return showDayError(!text ? 'Enter a date as yyyy-MM-dd.'
            : /^\d{4}-\d{2}-\d{2}$/.test(text) ? `${text} isn't a real date.` : 'Use yyyy-MM-dd, e.g. 2026-11-28.');
        showDayError(null);
        if (day !== new URLSearchParams(location.search).get('date') || document.getElementById('report').hidden) renderDay(day);
        else input.value = day;
    }

    function updateNav(date) {
        showDayError(null);
        document.getElementById('dayInput').value = date;
        document.getElementById('dayPicker').value = date;
        document.getElementById('prevDay').disabled = !dates.some(d => d < date);
        document.getElementById('nextDay').disabled = !dates.some(d => d > date);
    }

    function step(direction) {
        const current = document.getElementById('dayInput').value;
        const target = direction < 0 ? dates.filter(d => d < current).pop() : dates.find(d => d > current);
        if (target) renderDay(target);
    }

    async function initialize() {
        const status = document.getElementById('status');
        Mb.setStatus(status, 'info', 'Loading daily figures…');
        try {
            const [days, deliveries] = await Promise.all([
                fetchRows(MAIN_SHEET_ID, "cumilativeCalculations").then(useTotalBalanceDues),
                fetchRows(MAIN_SHEET_ID, "db2.deliveries")
            ]);
            days.forEach(row => {
                const date = dayOf(row.date);
                if (!daysByDate.has(date)) daysByDate.set(date, []);
                daysByDate.get(date).push(row);
            });
            dates = [...daysByDate.keys()].sort();
            addDeliveries(deliveries);
        } catch (error) {
            console.error('Error fetching data:', error);
            Mb.setStatus(status, 'error', 'Could not load the daily figures. Please try again.');
            return;
        }
        ['dayInput', 'dayPicker', 'latestDay'].forEach(id => document.getElementById(id).disabled = false);
        const requested = new URLSearchParams(location.search).get('date');
        renderDay(/^\d{4}-\d{2}-\d{2}$/.test(requested || '') ? requested : dates[dates.length - 1]);
    }

    // Date box: type yyyy-MM-dd and press Enter (or leave the box); a pasted date goes straight to that day.
    const dayInput = document.getElementById('dayInput');
    dayInput.addEventListener('keydown', event => {
        if (event.key === 'Enter') { event.preventDefault(); commitTypedDay(); }
        if (event.key === 'Escape') updateNav(new URLSearchParams(location.search).get('date') || dayInput.value);
    });
    dayInput.addEventListener('change', commitTypedDay);
    dayInput.addEventListener('input', () => showDayError(null));
    dayInput.addEventListener('paste', event => {
        const day = parseDay(event.clipboardData?.getData('text'));
        if (!day) return;   // let the text in; Enter or leaving the box then says what's wrong
        event.preventDefault();
        dayInput.value = day;
        commitTypedDay();
    });
    // Calendar icon: the native picker (showPicker for desktop browsers that open it only from their own icon).
    const dayPicker = document.getElementById('dayPicker');
    dayPicker.addEventListener('click', () => { try { dayPicker.showPicker(); } catch { /* opens natively */ } });
    dayPicker.addEventListener('change', () => { if (dayPicker.value) renderDay(dayPicker.value); });
    document.getElementById('prevDay').addEventListener('click', () => step(-1));
    document.getElementById('nextDay').addEventListener('click', () => step(1));
    document.getElementById('latestDay').addEventListener('click', () => renderDay(dates[dates.length - 1]));

    // Customers who last bought before 2026 still carry balances, so "All non-zero balances" needs the archive.
    document.getElementById('showAllBalances').addEventListener('change', event => {
        const date = document.getElementById('dayInput').value;
        if (!date || document.getElementById('report').hidden) return;
        if (!event.target.checked || archiveLoaded) return renderCustomers(date);
        const status = document.getElementById('status');
        Mb.setStatus(status, 'info', 'Loading 2023–2025 balances…');
        event.target.disabled = true;
        loadArchive().then(() => {
            Mb.setStatus(status, null);
            if (document.getElementById('dayInput').value === date) renderCustomers(date);
        }, error => {
            console.error('Error fetching archive:', error);
            Mb.setStatus(status, 'error', 'Could not load 2023–2025 balances, so customers whose last entry was before 2026 may be missing.');
            renderCustomers(date);
        }).finally(() => { event.target.disabled = false; });
    });

    initialize();
</script>
</body>
</html>
