<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Deliveries · Mondal Brothers</title>
    <link rel="icon" href="../../assets/img/favicon.svg" type="image/svg+xml">
    <link rel="manifest" href="../../manifest.webmanifest">
    <link rel="apple-touch-icon" href="../../assets/img/apple-touch-icon.png">
    <meta name="theme-color" content="#1f6f4a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="MBros">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Bengali:wght@400;600&display=swap">
    <link rel="stylesheet" href="../../assets/css/site.css">
    <link rel="stylesheet" href="deliveries.css">
    <script src="../../assets/js/common.js"></script>
</head>
<body data-page="deliveries">

<main class="app-main wide">
    <div class="container">

        <div class="page-header">
            <div>
                <h1>Delivery report</h1>
                <p>Delivered KG per customer, grouped by event period and compared across years.</p>
            </div>
        </div>

        <input type="date" id="calendarDate" hidden>

        <div class="report-layout">

            <aside class="card card-body controls">

                <div class="control-section">
                    <label class="label" for="reportTitle">Report title</label>
                    <input type="text" id="reportTitle" class="input" value="Durga Puja" placeholder="Enter report title">
                    <!-- Enabled by updatePublishActions() once a report is on screen. -->
                    <div class="publish-actions">
                        <button type="button" class="btn btn-secondary btn-icon" data-publish onclick="printReport()" title="Print PDF" aria-label="Print PDF" disabled><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V3h12v6"/><rect x="6" y="14" width="12" height="7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/></svg></button>
                        <button type="button" class="btn btn-secondary btn-icon" data-publish onclick="shareReportPdf()" title="Share PDF" aria-label="Share PDF" disabled><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg></button>
                        <button type="button" class="btn btn-secondary btn-icon" data-publish onclick="shareReportLink()" title="Share link" aria-label="Share link" disabled><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg></button>
                    </div>
                    <div id="shareStatus" class="status" hidden></div>
                </div>

                <div class="control-section">
                    <span class="label">Selected dates</span>
                    <div id="dateGroups" class="date-groups"></div>
                    <button type="button" class="btn btn-secondary btn-block" onclick="createDateGroup()">+ Create group</button>
                </div>

                <div class="control-section">
                    <span class="label">Highlighted dates</span>
                    <div id="highlightedDates" class="highlighted-dates">
                        <span class="no-highlighted-dates">Click a date in the report</span>
                    </div>
                </div>

                <div class="control-section">
                    <button type="button" class="btn btn-primary btn-block" onclick="fetchData()">Get delivered KG</button>
                    <p id="loading" class="status status-info" style="display: none;">
                        <span class="spinner" aria-hidden="true"></span> Fetching data…
                    </p>
                </div>

            </aside>

            <section>
                <div id="reportBanner" class="card report-banner">Delivered KG Report</div>

                <div id="yearReports">
                    <div class="card empty-state">
                        <div class="empty-state-title">No report generated</div>
                        <div>Create one or more date groups and click “Get delivered KG”.</div>
                    </div>
                </div>
            </section>

        </div>
    </div>
</main>

<script src="../../assets/js/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
<script src="../../assets/js/statement-pdf.js"></script>
<script src="deliveries.js"></script>
</body>
</html>
